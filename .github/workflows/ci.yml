name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  pipeline:
    uses: Pawiacl/pcl-workflows/.github/workflows/build-deploy.yml@main
    with:
      container-app: ca-pcl-registration-dev
      deploy: ${{ github.event_name == 'push' }}
